name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/PodPilot.Core.Tests -c Release

      - name: Publish
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish src/PodPilot.App -c Release -r $rid --self-contained `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o "publish/$rid"
            Compress-Archive -Path "publish/$rid/*" -DestinationPath "PodPilot-$rid.zip" -Force
          }

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: PodPilot-*.zip

  driver:
    runs-on: windows-2022
    strategy:
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2
        with:
          # The WDK's InfVerif/ApiValidator only ship for the x64 host on this image.
          msbuild-architecture: x64

      - name: Build driver
        run: msbuild driver/PodPilotAap/PodPilotAap.vcxproj -p:Configuration=Release -p:Platform=${{ matrix.platform }} -m

      - name: Package
        shell: pwsh
        run: |
          $platform = '${{ matrix.platform }}'
          $out = "staging"
          New-Item -ItemType Directory -Force $out | Out-Null
          $files = Get-ChildItem driver/PodPilotAap -Recurse -Include PodPilotAap.sys, PodPilotAap.inf, podpilotaap.cat, *.cer |
            Where-Object { $_.FullName -match "\\$platform\\Release\\" }
          $files | ForEach-Object { Write-Host $_.FullName }
          foreach ($name in 'PodPilotAap.sys', 'PodPilotAap.inf', 'PodPilotAap.cat') {
            $file = $files | Where-Object Name -eq $name | Select-Object -First 1
            if (-not $file) { throw "$name was not produced" }
            Copy-Item $file.FullName $out
          }
          $files | Where-Object Extension -eq '.cer' | Select-Object -First 1 | Copy-Item -Destination $out
          Copy-Item driver/install-driver.ps1, driver/uninstall-driver.ps1, driver/README.md $out
          $arch = $platform.ToLower()
          Compress-Archive -Path "$out/*" -DestinationPath "PodPilotAap-driver-$arch.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: driver-${{ matrix.platform }}
          path: PodPilotAap-driver-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [app, driver]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
          generate_release_notes: true
